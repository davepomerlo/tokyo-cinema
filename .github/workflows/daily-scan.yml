name: Daily scan

on:
  schedule:
    # 19:50 UTC = 04:50 JST. GitHub often starts scheduled runs 5–20 minutes
    # late, so listings are normally live a little after 5:00 JST.
    - cron: "50 19 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test parser
        run: python -m unittest discover tests

      - name: Scan theaters
        # A push that only changes the site redeploys without re-scanning.
        if: github.event_name != 'push'
        env:
          # Optional: add this secret to get English titles for Japanese-only films.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional (free): original language + English titles from TMDB.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python -m scraper.run

      - name: Keep pages that could not be parsed (for debugging)
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated listings
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Listings for $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
